<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quelle heure est-il à Paris ?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1612;
      --paper: #f5f0e8;
      --cream: #ede8dc;
      --accent: #c0392b;
      --gold: #b8972a;
      --muted: #8a8070;
      --border: #cfc8b8;
    }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(184,151,42,0.07) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(192,57,43,0.06) 0%, transparent 50%);
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem auto;
      max-width: 200px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider-icon {
      color: var(--gold);
      font-size: 0.9rem;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 2rem 2.5rem;
      box-shadow: 4px 4px 0px var(--cream), 4px 4px 0px 1px var(--border);
    }

    .field-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 2px;
      appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
    }

    .tz-hint {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.35rem;
      line-height: 1.4;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: white;
      background: var(--ink);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover { background: var(--accent); }
    .btn:active { transform: translateY(1px); }

    .result {
      margin-top: 2rem;
      padding: 1.75rem 2rem;
      background: var(--ink);
      color: var(--paper);
      border-radius: 2px;
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .result.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .result-time {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 8vw, 3.8rem);
      font-weight: 700;
      line-height: 1;
      color: white;
      letter-spacing: -0.01em;
    }

    .result-time span {
      font-size: 1rem;
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      color: var(--muted);
      vertical-align: middle;
      margin-left: 0.4rem;
    }

    .result-sub {
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: #a09888;
      line-height: 1.6;
    }

    .result-sub strong { color: var(--paper); font-weight: 400; }

    .error {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(192,57,43,0.1);
      border-left: 3px solid var(--accent);
      color: var(--accent);
      font-size: 0.8rem;
      display: none;
      border-radius: 0 2px 2px 0;
    }
    .error.visible { display: block; }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    @media (max-width: 480px) {
      .field-group { grid-template-columns: 1fr; }
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <p class="eyebrow">Convertisseur de fuseau horaire</p>
    <h1>Quelle heure est-il<br>à <em>Paris</em> ?</h1>
    <div class="divider"><span class="divider-icon">✦</span></div>
  </header>

  <div class="card">
    <div class="field-group">
      <div>
        <label for="time-input">Heure locale</label>
        <input type="time" id="time-input" value="19:30" />
      </div>
      <div>
        <label for="tz-input">Fuseau horaire</label>
        <input type="text" id="tz-input" placeholder="ex: UTC+8, EST, JST…" autocomplete="off" autocorrect="off" spellcheck="false" />
        <div class="tz-hint">UTC±X · GMT±X · ou nom : EST, CET, JST, IST…</div>
      </div>
    </div>

    <button class="btn" onclick="convert()">→ Convertir en heure parisienne</button>

    <div class="error" id="error-box"></div>
  </div>

  <div class="result" id="result-box">
    <div class="result-label">À Paris, il est</div>
    <div class="result-time" id="result-time"></div>
    <div class="result-sub" id="result-sub"></div>
  </div>

  <footer>Heure de Paris · Europe/Paris · GMT+1 / GMT+2 (été)</footer>
</div>

<script>
  // ── Named timezone abbreviations → offset in minutes ──────────────────────
  // Standard (non-DST) offsets. DST variants listed separately.
  const TZ_NAMES = {
    // UTC / GMT
    'UTC': 0, 'GMT': 0,
    // Europe
    'WET': 0,                          // Western European Time
    'CET': 60, 'MET': 60,             // Central European Time
    'EET': 120,                        // Eastern European Time
    'CEST': 120, 'MEST': 120,          // CET summer / DST
    'EEST': 180,                       // EET summer
    'MSK': 180,                        // Moscow
    // Americas
    'NST': -210, 'NDT': -150,          // Newfoundland
    'AST': -240, 'ADT': -180,          // Atlantic
    'EST': -300, 'EDT': -240,          // Eastern
    'CST': -360, 'CDT': -300,          // Central
    'MST': -420, 'MDT': -360,          // Mountain
    'PST': -480, 'PDT': -420,          // Pacific
    'AKST': -540, 'AKDT': -480,        // Alaska
    'HST': -600, 'HDT': -540,          // Hawaii
    'SST': -660,                       // Samoa
    // Asia / Pacific
    'IST': 330,                        // India
    'NPT': 345,                        // Nepal
    'BST_BD': 360,                     // Bangladesh (BST conflicts with British Summer)
    'ICT': 420,                        // Indochina
    'WIB': 420,                        // West Indonesia
    'CST_CN': 480, 'HKT': 480, 'SGT': 480, 'MYT': 480, 'AWST': 480, // UTC+8
    'JST': 540, 'KST': 540,           // Japan / Korea
    'ACST': 570, 'ACDT': 630,         // Australia Central
    'AEST': 600, 'AEDT': 660,         // Australia Eastern
    'NZST': 720, 'NZDT': 780,         // New Zealand
    // Middle East / Africa
    'CAT': 120, 'SAST': 120,          // Central/South Africa
    'EAT': 180,                        // East Africa
    'GST': 240,                        // Gulf
    'PKT': 300,                        // Pakistan
    'IRDT': 270, 'IRST': 210,         // Iran
  };

  // ── Parse a timezone string → offset in minutes ────────────────────────────
  // Accepts: UTC+8, UTC-5, UTC+5:30, GMT+8, EST, JST, CET, +08:00, -5, +5.5 …
  function parseTZ(raw) {
    const s = raw.trim().toUpperCase().replace(/[−–—]/g, '-');

    // 1. Pure named abbreviation (e.g. "EST", "JST")
    if (/^[A-Z_]+$/.test(s)) {
      if (s in TZ_NAMES) return { offset: TZ_NAMES[s], label: raw.trim() };
      return null;
    }

    // 2. Named + numeric offset (e.g. "UTC+8", "GMT-5:30", "EDT+4")
    //    The numeric part overrides the named base — user is being explicit
    const namedNumeric = s.match(/^([A-Z_]+)\s*([+-])(\d{1,2})(?::(\d{2}))?$/);
    if (namedNumeric) {
      const sign = namedNumeric[2] === '+' ? 1 : -1;
      const h = parseInt(namedNumeric[3]);
      const m = parseInt(namedNumeric[4] || '0');
      const offset = sign * (h * 60 + m);
      return { offset, label: raw.trim() };
    }

    // 3. Pure numeric offset (e.g. "+8", "-5:30", "+05:30", "8", "-5.5")
    const pureNum = s.match(/^([+-]?)(\d{1,2})(?::(\d{2})|\.(\d+))?$/);
    if (pureNum) {
      const sign = pureNum[1] === '-' ? -1 : 1;
      const h = parseInt(pureNum[2]);
      let m = 0;
      if (pureNum[3]) m = parseInt(pureNum[3]);
      else if (pureNum[4]) m = Math.round(parseFloat('0.' + pureNum[4]) * 60);
      const offset = sign * (h * 60 + m);
      return { offset, label: (sign >= 0 ? 'UTC+' : 'UTC') + (sign < 0 ? '-' : '') + h + (m ? ':' + String(m).padStart(2,'0') : '') };
    }

    return null;
  }

  // ── Paris offset (handles DST) ─────────────────────────────────────────────
  function getParisTZOffset() {
    const now = new Date();
    const parisStr = now.toLocaleString('en-US', { timeZone: 'Europe/Paris', hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const utcStr = now.toLocaleString('en-US', { timeZone: 'UTC', hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const parseDate = s => {
      const [datePart, timePart] = s.split(', ');
      const [m, d, y] = datePart.split('/');
      return new Date(`${y}-${m}-${d}T${timePart}Z`);
    };
    return (parseDate(parisStr) - parseDate(utcStr)) / 60000;
  }

  // ── Main conversion ────────────────────────────────────────────────────────
  function convert() {
    const timeVal = document.getElementById('time-input').value;
    const tzRaw   = document.getElementById('tz-input').value;
    const errBox  = document.getElementById('error-box');
    const resultBox = document.getElementById('result-box');

    errBox.classList.remove('visible');
    resultBox.classList.remove('visible');

    if (!timeVal) {
      errBox.textContent = 'Veuillez saisir une heure.';
      errBox.classList.add('visible');
      return;
    }

    if (!tzRaw.trim()) {
      errBox.textContent = 'Veuillez saisir un fuseau horaire (ex : UTC+8, EST, JST…)';
      errBox.classList.add('visible');
      return;
    }

    const parsed = parseTZ(tzRaw);
    if (parsed === null) {
      errBox.textContent = `Fuseau horaire non reconnu : "${tzRaw}". Essayez UTC+8, GMT-5, EST, JST, +5:30…`;
      errBox.classList.add('visible');
      return;
    }

    const { offset: srcOffset, label: srcLabel } = parsed;

    const [hh, mm] = timeVal.split(':').map(Number);
    const localMinutes = hh * 60 + mm;
    const utcMinutes   = localMinutes - srcOffset;

    const parisOffset = getParisTZOffset();
    let parisMinutes  = utcMinutes + parisOffset;

    let dayShift = 0;
    if (parisMinutes < 0)    { parisMinutes += 1440; dayShift = -1; }
    else if (parisMinutes >= 1440) { parisMinutes -= 1440; dayShift = 1; }

    const parisH = Math.floor(parisMinutes / 60);
    const parisM = parisMinutes % 60;

    const pad = n => String(n).padStart(2, '0');
    const timeStr = `${pad(parisH)}h${pad(parisM)}`;

    let period = '';
    if (parisH < 5)                         period = 'en pleine nuit';
    else if (parisH < 8)                    period = 'tôt le matin';
    else if (parisH < 12)                   period = 'le matin';
    else if (parisH === 12 && parisM === 0) period = 'à midi pile';
    else if (parisH < 14)                   period = 'à l\'heure du déjeuner';
    else if (parisH < 18)                   period = 'l\'après-midi';
    else if (parisH < 21)                   period = 'en soirée';
    else                                    period = 'tard le soir';

    let dayNote = '';
    if (dayShift === 1)  dayNote = ' <strong>(lendemain)</strong>';
    if (dayShift === -1) dayNote = ' <strong>(veille)</strong>';

    const parisOffsetH = parisOffset / 60;
    const parisOffsetStr = `UTC${parisOffsetH >= 0 ? '+' : ''}${parisOffsetH}`;

    // Show resolved offset under the input
    const offsetH = Math.floor(Math.abs(srcOffset) / 60);
    const offsetM = Math.abs(srcOffset) % 60;
    const offsetStr = `UTC${srcOffset >= 0 ? '+' : '-'}${offsetH}${offsetM ? ':' + pad(offsetM) : ''}`;
    document.getElementById('tz-input').title = `Interprété comme : ${offsetStr}`;

    document.getElementById('result-time').innerHTML =
      `${timeStr} <span>${parisOffsetStr}</span>`;
    document.getElementById('result-sub').innerHTML =
      `Il est ${period} à Paris.${dayNote}<br>` +
      `<span style="opacity:.6">${pad(hh)}:${pad(mm)} (${srcLabel} = ${offsetStr}) → ${timeStr} (Europe/Paris)</span>`;

    resultBox.classList.add('visible');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') convert(); });

  // Auto-fill current local time
  const now = new Date();
  document.getElementById('time-input').value =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('tz-input').value = 'UTC+8';
</script>
</body>
</html>
